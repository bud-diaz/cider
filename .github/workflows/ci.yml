name: CI

# docs/06-testing-strategy.md defines the CI matrix as:
#   Ubuntu supported LTS x Debug/Release runtime x Swift supported version(s)
# README.md documents the same apt packages and Xvfb setup used here.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Swift ${{ matrix.swift }} / ${{ matrix.configuration }} / ${{ matrix.ubuntu }}
    runs-on: ${{ matrix.ubuntu }}
    container: swift:${{ matrix.swift }}-${{ matrix.ubuntu == 'ubuntu-24.04' && 'noble' || 'jammy' }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0"]
        configuration: [debug, release]
        ubuntu: [ubuntu-24.04, ubuntu-22.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libfreetype-dev libfontconfig-dev \
            xvfb

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: cider doctor prerequisites
        run: |
          echo "Swift: $(swift --version)"
          pkg-config --modversion x11 freetype2 fontconfig

      - name: Build (${{ matrix.configuration }})
        run: swift build --configuration ${{ matrix.configuration }}

      - name: Test (${{ matrix.configuration }})
        run: swift test --configuration ${{ matrix.configuration }}

      # Each example under examples/ is an independent SwiftPM package (a
      # path dependency on the repo root, the same as a real project would
      # use a tagged version), so `swift build`/`swift test` at the repo
      # root never touches them. Nothing else verifies that application
      # code outside this repo can actually use the compatibility API --
      # B9 hit exactly that gap (Color/ImageSource weren't reachable
      # without a CiderCore product dependency the example never declared)
      # with no CI signal to catch it.
      - name: Build example apps (${{ matrix.configuration }})
        run: |
          for example in examples/*/; do
            echo "::group::$example"
            (cd "$example" && swift build --configuration ${{ matrix.configuration }})
            echo "::endgroup::"
          done
